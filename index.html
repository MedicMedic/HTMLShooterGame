<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game</title>
    <link rel="stylesheet" href="shooter.css">
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <button type="button" id="btn-pause"      aria-label="Pause">II</button>
        <button type="button" id="btn-fullscreen" aria-label="Fullscreen">[ ]</button>

        <!--
            Left cluster layout:
              SWAP
              ◀  ▶
        -->
        <div id="mc-left">
            <div class="mc-row">
                <button type="button" class="mc-btn mc-swap" id="mc-btn-swap"  aria-label="Cycle bullet">SWAP</button>
            </div>
            <div class="mc-row">
                <button type="button" class="mc-btn" id="mc-btn-left"  aria-label="Move left">&#9664;</button>
                <button type="button" class="mc-btn" id="mc-btn-right" aria-label="Move right">&#9654;</button>
            </div>
        </div>

        <!--
            Right cluster layout:
                       JUMP
              FIRE  ▼
        -->
        <div id="mc-right">
            <div class="mc-row mc-row-right">
                <button type="button" class="mc-btn mc-jump" id="mc-btn-up"   aria-label="Jump">JUMP</button>
            </div>
            <div class="mc-row mc-row-right">
                <button type="button" class="mc-btn mc-fire" id="mc-btn-fire" aria-label="Shoot">FIRE</button>
                <button type="button" class="mc-btn"         id="mc-btn-down" aria-label="Drop">&#9660;</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/entities/Body.js"></script>
    <script src="js/entities/Bullet.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/Pickup.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

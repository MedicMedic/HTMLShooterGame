<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooter Game</title>
    <link rel="stylesheet" href="shooter.css">
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <button type="button" id="btn-pause"      aria-label="Pause">II</button>
        <button type="button" id="btn-fullscreen" aria-label="Fullscreen">[ ]</button>

        <!--
            Left cluster:
              col1   col2
            [ SWAP ]  ___     row 1
            [  ◀  ] [ ▶ ]    row 2
        -->
        <div id="mc-left">
            <button type="button" class="mc-btn mc-swap" id="mc-btn-swap"  aria-label="Cycle">SWAP</button>
            <button type="button" class="mc-btn"         id="mc-btn-left"  aria-label="Left">&#9664;</button>
            <button type="button" class="mc-btn"         id="mc-btn-right" aria-label="Right">&#9654;</button>
        </div>

        <!--
            Right cluster:
              col1   col2
               ___  [JUMP]    row 1
            [FIRE] [ ▼  ]    row 2
        -->
        <div id="mc-right">
            <button type="button" class="mc-btn mc-jump" id="mc-btn-up"   aria-label="Jump">JUMP</button>
            <button type="button" class="mc-btn mc-fire" id="mc-btn-fire" aria-label="Fire">FIRE</button>
            <button type="button" class="mc-btn"         id="mc-btn-down" aria-label="Drop">&#9660;</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/entities/Body.js"></script>
    <script src="js/entities/Bullet.js"></script>
    <script src="js/entities/Enemy.js"></script>
    <script src="js/entities/Player.js"></script>
    <script src="js/entities/Pickup.js"></script>
    <script src="js/Game.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
